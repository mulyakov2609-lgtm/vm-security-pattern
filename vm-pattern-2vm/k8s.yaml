# TWO UBUNTU VMs. VM2 hosts all five roles. Image vm-pattern:3.0.
# Secret internal-token, key INTERNAL_TOKEN. No external data URL.
apiVersion: v1
kind: Namespace
metadata:
  name: secure-app
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: secure-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: vm-pattern:3.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: ROLE
          value: gateway
        - name: INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: internal-token
              key: INTERNAL_TOKEN
        - name: REQUEST_LIMIT
          value: '5'
        - name: WINDOW_SECONDS
          value: '10'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: secure-app
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
